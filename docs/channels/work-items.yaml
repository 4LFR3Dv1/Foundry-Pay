  - id: FC-CTRL-017
    status: done
    objective: distinguish forbidden authority or economic effects from permitted rejection audit effects
    owner: program-integrator
    repository: 4LFR3Dv1/Foundry-Pay
    allowed_paths:
      - .agents/tasks/FC-CTRL-017.yaml
      - .agents/tasks/FC-SEC-002.yaml
