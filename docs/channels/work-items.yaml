      - docs/channels/security/FC-SEC-002-CONTRACT.md
      - tests/channels/test_foundation_contracts.py
      - evidence/runs/FC-CTRL-017/**
    dependencies: [FC-CTRL-016]
    invariants:
      - rejected authority creates no economic effect
      - rejected authority never advances verified, activation-requested, authorized, or completed state
      - a durable rejection audit record is permitted and expected
      - audit observability never becomes economic authority
    acceptance:
      - zero effect is defined by economic and authority counters
      - rejection journal mutations are classified separately
      - the existing voucher rejection journal remains observable
      - recipient binding still verifies before insertion
    tests:
      - foundation work-graph validation
      - frozen effect-taxonomy assertions
      - full regression
      - secret scan
    evidence:
      - evidence/runs/FC-CTRL-017/README.md
      - evidence/runs/FC-CTRL-017/validation-report.json
      - evidence/runs/FC-CTRL-017/artifact-manifest.json
    security_review: self-validated governance clarification; external review required before mainnet or real-value authorization
    stop_conditions:
      - a rejected object advances authority
      - an audit record is treated as economic completion
      - rejection observability is removed to satisfy a metric
      - implementation paths change

