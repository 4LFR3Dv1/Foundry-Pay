  - id: FC-PROTO-007
    status: blocked
    objective: publish cross-language Python, TypeScript, and Rust conformance vectors
    owner: conformance-engineer
    repository: 4LFR3Dv1/Foundry-Pay
    allowed_paths:
      - .github/workflows/ci.yml
      - .agents/tasks/FC-PROTO-007.yaml
      - docs/channels/WORK_GRAPH.md
      - docs/channels/work-items.yaml
      - packages/channel-protocol/python/**
      - packages/channel-protocol/typescript/**
      - packages/channel-protocol/rust/**
      - contracts/channel/conformance/**
      - tests/channels/conformance/**
      - evidence/runs/FC-PROTO-007/**
      - provenance/REUSE_LEDGER.yaml
      - provenance/THIRD_PARTY_NOTICES.md
    dependencies: [FC-PROTO-006, FC-CTRL-014]
    invariants:
      - all implementations produce identical bytes and hashes for positive vectors
      - all implementations produce identical rejection stages and codes for negative vectors
      - runners compute from source inputs and never echo expected result fields
      - runners do not import, invoke, generate, or read another language implementation
      - the comparator never canonicalizes, normalizes, or repairs runner output
    acceptance:
      - all eight frozen positive vectors agree byte-for-byte in three implementations
      - all twenty frozen negative vectors agree on exact stage and code in three implementations
      - poisoning expected bytes, lengths, and hashes does not change computed runner output
      - CI runs each runner independently and compares only after all outputs exist
    tests:
      - per-language runner tests
      - cross-language comparator
      - expected-output poisoning
      - missing, duplicate, malformed, and out-of-order result rejection
    evidence:
      - exact toolchain and dependency versions
      - three result streams
      - cross-language comparison report
      - artifact manifest and full regression
    security_review: independent-conformance-review
    stop_conditions:
      - any implementation silently normalizes differently
      - a positive vector agrees only on decision but not bytes and hash
      - a negative vector agrees only on rejection but not stage and code
      - expected result fields are used as computation inputs
      - one runner delegates to another implementation

