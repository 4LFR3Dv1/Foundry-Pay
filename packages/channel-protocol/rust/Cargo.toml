[package]
name = "foundry-channel-conformance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.8"

[dev-dependencies]
tempfile = "=3.19.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
