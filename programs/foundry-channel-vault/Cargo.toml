[package]
name = "foundry-channel-vault-account-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
solana-pubkey = { version = "=2.1.21", features = ["curve25519"] }
solana-rent = "=2.1.21"

[dev-dependencies]
proptest = "=1.6.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
