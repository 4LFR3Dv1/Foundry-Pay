name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/external-execution-protocol/typescript/package-lock.json
            packages/channel-protocol/typescript/package-lock.json
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          npm ci --prefix packages/external-execution-protocol/typescript
          npm ci --prefix packages/channel-protocol/typescript
      - name: Static checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python scripts/check_secrets.py
      - name: Check out pinned Solana-Agent chaos runtime
        uses: actions/checkout@v4
        with:
          repository: 4LFR3Dv1/Solana-Agent
          ref: 5707240af22bc288149b68456b2a9fe810928efb
          path: .chaos/Solana-Agent
      - name: Install pinned Solana-Agent
        run: python -m pip install -e .chaos/Solana-Agent
      - name: Protocol tests
        env:
          SOLANA_AGENT_ROOT: ${{ github.workspace }}/.chaos/Solana-Agent
        run: |
          python -m pytest
          npm test --prefix packages/external-execution-protocol/typescript
          npm test --prefix packages/channel-protocol/typescript
      - name: Publish FP-FAIL-002 journal root
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-fail-002-journal-root-${{ github.sha }}
          path: evidence/runs/FP-FAIL-002/journal-root.json
          if-no-files-found: error
          retention-days: 90

  conformance-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install locked Python conformance dependency
        run: |
          python -m pip install -e .
          python -m pip install -r packages/channel-protocol/python/requirements-conformance.lock
      - name: Run independent Python implementation
        env:
          PYTHONPATH: packages/channel-protocol/python
        run: |
          python -m foundry_channel_protocol.conformance_runner \
            --registry-root contracts/channel/canonicalization \
            > python-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: fc-proto-007-python-${{ github.sha }}
          path: python-results.jsonl
          if-no-files-found: error
          retention-days: 90

  conformance-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: packages/channel-protocol/typescript/package-lock.json
      - name: Install and compile locked TypeScript implementation
        run: |
          npm ci --prefix packages/channel-protocol/typescript
          npm run build --prefix packages/channel-protocol/typescript
      - name: Run independent TypeScript implementation
        run: |
          node packages/channel-protocol/typescript/dist/packages/channel-protocol/typescript/src/conformance-runner.js \
            --registry-root contracts/channel/canonicalization \
            > typescript-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: fc-proto-007-typescript-${{ github.sha }}
          path: typescript-results.jsonl
          if-no-files-found: error
          retention-days: 90

  conformance-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy,rustfmt
      - name: Verify and run independent Rust implementation
        run: |
          cargo fmt --check --manifest-path packages/channel-protocol/rust/Cargo.toml
          cargo clippy --locked --manifest-path packages/channel-protocol/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path packages/channel-protocol/rust/Cargo.toml
          cargo run --quiet --locked --manifest-path packages/channel-protocol/rust/Cargo.toml -- \
            --registry-root contracts/channel/canonicalization \
            > rust-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: fc-proto-007-rust-${{ github.sha }}
          path: rust-results.jsonl
          if-no-files-found: error
          retention-days: 90

  conformance-compare:
    needs:
      - conformance-python
      - conformance-typescript
      - conformance-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: fc-proto-007-*-${{ github.sha }}
          path: runner-results
          merge-multiple: true
      - name: Compare exact bytes, hashes, rejection stages, and codes
        run: |
          python tests/channels/conformance/comparator.py \
            --streams-dir runner-results \
            --report comparison-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: fc-proto-007-comparison-${{ github.sha }}
          path: |
            runner-results/*.jsonl
            comparison-report.json
          if-no-files-found: error
          retention-days: 90

  conformance-poisoning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: packages/channel-protocol/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Install locked implementations
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r packages/channel-protocol/python/requirements-conformance.lock
          npm ci --prefix packages/channel-protocol/typescript
          npm run build --prefix packages/channel-protocol/typescript
      - name: Prove expected-output independence
        run: |
          python tests/channels/conformance/run_cross_language.py \
            --output-root evidence/runs/FC-PROTO-007
      - uses: actions/upload-artifact@v4
        with:
          name: fc-proto-007-poisoning-${{ github.sha }}
          path: evidence/runs/FC-PROTO-007
          if-no-files-found: error
          retention-days: 90
