      - tests/channels/test_channel.py
    constraints:
      - no Cloud, wallet, signer, RPC, or Solana program authority
      - successful validation does not assert on-chain observation
      - arithmetic follows docs/channels/CHANNEL_PROTOCOL.md at the pinned baseline

