  - python -m ruff check .
  - python -m ruff format --check .
  - python scripts/check_secrets.py
  - git diff --check
evidence:
  - evidence/runs/FC-CTRL-020/README.md
  - evidence/runs/FC-CTRL-020/validation-report.json
provenance:
  - FC-SEC-002 merge 0d203389052a78d6cdec5b565ca28e605dad13fb
  - FC-CTRL-019 merge c61c9e8beb6815ed656f60f04e71efa1e5bd7375
stop_conditions:
  - program runtime or instruction behavior is implemented
  - a separate recipient, settlement, or closure account is introduced
  - external review is inferred
  - deployment authorization is broadened
