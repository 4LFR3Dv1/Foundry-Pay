work_item: FC-CTRL-020
objective: freeze the FC-SOL-002 account-layout, token-boundary, maturity, and reserved-path contract
owner: program-integrator
branch: agent/control/FC-CTRL-020
allowed_paths:
  - .agents/tasks/FC-CTRL-020.yaml
  - .agents/tasks/FC-SOL-002.yaml
  - docs/channels/WORK_GRAPH.md
  - docs/channels/work-items.yaml
  - docs/channels/solana/accounts/FC-SOL-002-CONTRACT.md
  - tests/channels/test_foundation_contracts.py
  - evidence/runs/FC-CTRL-020/**
dependencies:
  - FC-CTRL-019
  - FC-SEC-002
invariants:
  - FC-SOL-002 depends explicitly on the integrated FC-SEC-002 boundary proof
  - the account model contains only ChannelState PDA and its classic SPL Token vault
  - coordination introduces no program instruction, CPI, transfer, signature verification, or deployment
  - self-validation does not imply external Solana account review
