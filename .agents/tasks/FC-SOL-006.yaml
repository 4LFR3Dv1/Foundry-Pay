work_item: FC-SOL-006
objective: implement an operational ChannelVault program from the frozen v1 account/instruction/transition/governance contracts
owner: solana-program-implementer
branch: agent/solana/FC-SOL-006
allowed_paths:
  - programs/foundry-channel-vault/**
  - tests/channels/solana/runtime/**
  - docs/channels/solana/runtime/**
  - evidence/runs/FC-SOL-006/**
  - .agents/tasks/FC-SOL-006.yaml
dependencies:
  - FC-GOV-002
  - FC-SOL-002
  - FC-SOL-003A
  - FC-SOL-004
  - FC-SOL-005
invariants:
  - CHANNEL_STATE_SPACE remains 490 bytes
  - existing discriminator, field offsets, PDA seeds, and classic-token vault relationship remain unchanged
  - v1 instruction registry remains exactly initialize_channel, fund_channel, activate_voucher, bind_recipient, settle, request_close, refund_unallocated, finalize_close
  - signed voucher and recipient-binding preimages remain byte-identical to FC-PROTO-006
  - Ed25519 validation uses the immediately preceding top-level native precompile instruction with self-contained references
  - all arithmetic is checked and failed validation produces no successful CPI or event
  - settlement beneficiary is fixed by bound channel state
  - no mainnet deployment or real-value authorization enters this work item
acceptance:
  - executable Solana entrypoint exists
  - all eight handlers execute against real program accounts under local validator
  - initialize creates the exact ChannelState PDA and canonical classic SPL Token vault
  - funding and settlement perform exact SPL Token CPI with invariant-preserving state updates
  - activation and binding validate the frozen Ed25519 layouts and canonical preimages
  - close/refund/finalize preserve activated recipient rights and conservation
  - local-validator tests cover positive lifecycle and frozen negative classes
  - account serialization remains byte-compatible with FC-SOL-002 golden vectors
  - instruction semantics remain compatible with FC-SOL-003/003A vectors
  - reproducible SBF build procedure and artifact hash report exist
  - exact devnet Program ID/deployment is not claimed until separately authorized after evidence review
verification_commands:
  - cargo test --manifest-path programs/foundry-channel-vault/Cargo.toml
  - cargo test --manifest-path programs/foundry-channel-vault/instruction-contract/Cargo.toml
  - cargo test --manifest-path programs/foundry-channel-vault/transition-model/Cargo.toml
  - python -m pytest tests/channels/solana
  - python scripts/check_channel_foundation.py
evidence:
  - evidence/runs/FC-SOL-006/README.md
  - evidence/runs/FC-SOL-006/validation-report.json
  - evidence/runs/FC-SOL-006/artifact-manifest.json
  - evidence/runs/FC-SOL-006/sbf-build-report.json
provenance:
  - FC-SOL-002 exact account model
  - FC-SOL-003 and FC-SOL-003A exact instruction contract
  - FC-SOL-004 transition model
  - FC-SOL-005 governance/migration model
stop_conditions:
  - a v1 account offset or canonical signed preimage changes
  - Token-2022 or an unreviewed token extension enters scope
  - a handler requires hosted custody of a user wallet
  - mainnet deployment is requested
  - an economic effect cannot be made atomic and fail-closed
  - change falls outside allowed paths
