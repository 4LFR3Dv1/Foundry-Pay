  - evidence/runs/FC-CTRL-014/validation-report.json
provenance:
  - Python rfc8785 0.1.4 from PyPI, Apache-2.0
  - TypeScript canonicalize 3.0.0 from npm, Apache-2.0
  - Rust serde_json_canonicalizer 0.3.2 from crates.io, MIT
stop_conditions:
  - a runner or comparator is implemented in this coordination PR
  - a functional dependency is added to a package manifest
  - a frozen normative artifact changes
  - a generic rejection replaces exact stage and code comparison
