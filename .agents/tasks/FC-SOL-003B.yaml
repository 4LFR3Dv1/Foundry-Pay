work_item: FC-SOL-003B
objective: close the ChannelVault runtime signed-preimage and initialization operability gap without changing the v1 account layout or FC-PROTO-006 signed bytes
owner: protocol-runtime-integrator
branch: agent/solana/FC-SOL-003B
allowed_paths:
  - programs/foundry-channel-vault/instruction-contract/**
  - docs/channels/solana/instructions/**
  - tests/channels/solana/instructions/**
  - evidence/runs/FC-SOL-003B/**
  - .agents/tasks/FC-SOL-003B.yaml
dependencies:
  - FC-SOL-003A
  - FC-PROTO-006
invariants:
  - ChannelState remains exactly 490 bytes with the same discriminator, offsets, PDA seeds, and zero-meaning reserved bytes
  - FC-PROTO-006 voucher and recipient-binding canonical bytes remain byte-identical
  - all v1 FC-SOL-003 instruction vectors remain reproducible and unchanged
  - the eight operation names/discriminators remain closed and unchanged
  - the Ed25519 precompile layout remains immediately preceding and self-contained
  - runtime v2 consumes the exact FC-PROTO-006 signed message bytes and does not introduce a second signer preimage
  - economic instruction fields cannot diverge from the signed canonical payload
acceptance:
  - instruction contract version 2 is explicit and v1 remains decodable/reproducible
  - initialize v2 carries genesis_hash, channel_id_hash, environment, and policy_flags needed by the frozen ChannelState runtime
  - channel_id_hash is normatively SHA-256 over UTF-8 channel_id
  - initial latest voucher hash is the protocol zero hash
  - binding nonce integer 1 has a canonical u64-little-endian-plus-zero-tail mapping into the fixed 32-byte field
  - canonical Ed25519 message extraction helpers return the exact signed message without changing existing layouts
  - deterministic tests prove hash/field substitution cannot advance authority
  - no entrypoint, CPI, token transfer, deployment, or consumer integration enters this work item
verification_commands:
  - cargo test --manifest-path programs/foundry-channel-vault/instruction-contract/Cargo.toml --lib
  - python -m pytest tests/channels/solana/instructions
  - python scripts/check_channel_foundation.py
  - git diff --check
evidence:
  - evidence/runs/FC-SOL-003B/README.md
  - evidence/runs/FC-SOL-003B/validation-report.json
  - evidence/runs/FC-SOL-003B/artifact-manifest.json
provenance:
  - FC-PROTO-006 exact signed-payload profiles
  - FC-SOL-002 fixed-width account model
  - FC-SOL-003 and FC-SOL-003A transport/Ed25519 contracts
stop_conditions:
  - any FC-PROTO-006 signed byte changes
  - any ChannelState v1 byte offset or PDA seed changes
  - runtime accepts an economic field that is not bound to the signed payload
  - a second compact signer profile is introduced
  - entrypoint, CPI, transfer, deployment, mainnet, or real-value scope enters the correction
  - change falls outside allowed paths
