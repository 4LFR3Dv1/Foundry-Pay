work_item: FC-CTRL-023
objective: freeze the FC-SOL-003 instruction, account-meta, Ed25519, lifecycle, event, error, maturity, and reserved-path contract
owner: program-integrator
branch: agent/control/FC-CTRL-023
allowed_paths:
  - .agents/tasks/FC-CTRL-023.yaml
  - .agents/tasks/FC-SOL-003.yaml
  - docs/channels/WORK_GRAPH.md
  - docs/channels/work-items.yaml
  - docs/channels/solana/instructions/FC-SOL-003-CONTRACT.md
