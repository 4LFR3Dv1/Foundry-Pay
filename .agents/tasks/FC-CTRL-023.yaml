dependencies:
  - FC-CTRL-022
  - FC-SOL-002
  - FC-SEC-002
invariants:
  - FC-SOL-003 freezes contracts and deterministic fixtures without implementing economic handlers
  - the 490-byte ChannelState layout and FC-PROTO-006 preimages remain unchanged
  - Ed25519 evidence is self-contained, immediately preceding, exact-byte, and type-specific
  - self-validation does not imply external Solana instruction or Ed25519 review
acceptance:
