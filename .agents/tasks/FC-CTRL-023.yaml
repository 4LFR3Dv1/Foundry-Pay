  - FC-SOL-002 merge 818f565977766fbc3ddd05f24ad002ea04eb816e
  - FC-CTRL-022 merge bbe22320fa26a312dac8a179b6c40a6695adda3f
stop_conditions:
  - an economic handler, CPI, transfer, entrypoint, or deployment is implemented
