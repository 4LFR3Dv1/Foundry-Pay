  - closing_open and closing_frozen are derived without changing ChannelState layout
  - stable lifecycle, event, error, signature-precompile, and negative-vector requirements are frozen
  - local fixtures are allowed while devnet, mainnet, real value, transfers, and deployment remain blocked
